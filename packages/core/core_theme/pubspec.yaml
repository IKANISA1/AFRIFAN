name: core_theme
description: AFRICLUB Flutter design system — Revolut-Borrowed
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/revolut/
  fonts:
    - family: RevolutBorrowed
      fonts:
        - asset: assets/fonts/revolut/RevolutBorrowed-Regular.otf
          weight: 400
        - asset: assets/fonts/revolut/RevolutBorrowed-Medium.otf
          weight: 500
        - asset: assets/fonts/revolut/RevolutBorrowed-SemiBold.otf
          weight: 600
        - asset: assets/fonts/revolut/RevolutBorrowed-Bold.otf
          weight: 700
        - asset: assets/fonts/revolut/RevolutBorrowed-ExtraBold.otf
          weight: 800

resolution: workspace
