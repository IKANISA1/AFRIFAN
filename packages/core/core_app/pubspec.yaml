name: core_app
description: Centralized bootstrap, App structure, and Shell navigation logic.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  core_theme:
    path: ../core_theme
  core_auth:
    path: ../core_auth
  core_router:
    path: ../core_router
  core_utils:
    path: ../core_utils
  core_network:
    path: ../core_network
  core_modules:
    path: ../core_modules

  supabase_flutter: ^2.12.2
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

resolution: workspace

flutter:
  generate: true
