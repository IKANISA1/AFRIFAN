name: app_registry
description: App-level feature registry.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  core_router:
    path: ../core_router
  core_theme:
    path: ../core_theme

  feat_home:
    path: ../../features/feat_home
  feat_membership:
    path: ../../features/feat_membership
  feat_gamification:
    path: ../../features/feat_gamification
  feat_contributions:
    path: ../../features/feat_contributions
  feat_shop:
    path: ../../features/feat_shop
  feat_biopay:
    path: ../../features/feat_biopay
  feat_settings:
    path: ../../features/feat_settings
  feat_onboarding:
    path: ../../features/feat_onboarding
  feat_ticketing:
    path: ../../features/feat_ticketing
  feat_fan_clubs:
    path: ../../features/feat_fan_clubs
  feat_live:
    path: ../../features/feat_live
  feat_admin:
    path: ../../features/feat_admin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

resolution: workspace
