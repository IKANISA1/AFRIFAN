name: feat_ticketing
description: "Match ticketing module handling match discovery, seat selection, and e-ticket wallet."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core Platform
  core_auth:
    path: ../../core/core_auth
  core_theme:
    path: ../../core/core_theme
  core_network:
    path: ../../core/core_network
  core_utils:
    path: ../../core/core_utils
  core_router:
    path: ../../core/core_router
  feat_club:
    path: ../feat_club
    
  # External
  go_router: ^14.2.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.12.2

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test_support:
    path: ../test_support

flutter:
  assets:
    - test/fonts/
