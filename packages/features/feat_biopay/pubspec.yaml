name: feat_biopay
description: BioPay biometric face recognition and payment system
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Core packages
  core_theme:
    path: ../../core/core_theme
  core_auth:
    path: ../../core/core_auth
  core_router:
    path: ../../core/core_router
  core_network:
    path: ../../core/core_network
  core_utils:
    path: ../../core/core_utils
  # State management
  flutter_riverpod: ^2.6.1
  # Supabase
  supabase_flutter: ^2.12.2
  # ML & face detection
  tflite_flutter: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  # Camera & image processing
  camera: ^0.11.1
  image: ^4.5.3
  # Local auth
  local_auth: ^2.3.0
  # Local cache
  hive: ^2.2.3
  # Crypto for model checksum
  crypto: ^3.0.6
  # URL launching for payment handoff
  url_launcher: ^6.3.1
  # QR generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2
  # Sharing and export
  share_plus: ^11.1.0
  image_gallery_saver_plus: ^4.0.1
  # NFC
  flutter_nfc_kit: ^3.6.0
  ndef: ^0.3.4
  # Routing
  go_router: ^14.8.1
  # Design
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.2

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  test_support:
    path: ../test_support

flutter:
  assets:
    - test/fonts/
