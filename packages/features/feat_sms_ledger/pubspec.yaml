name: feat_sms_ledger
description: Mobile Money SMS interception and ledger synchronization via background processing.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  core_utils:
    path: ../../core/core_utils
  core_network:
    path: ../../core/core_network
  core_auth:
    path: ../../core/core_auth
  core_theme:
    path: ../../core/core_theme

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Core functional
  equatable: ^2.0.7
  crypto: ^3.0.7
  uuid: ^4.5.3

  # Target Dependencies
  another_telephony: ^0.4.1
  permission_handler: ^12.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

resolution: workspace
