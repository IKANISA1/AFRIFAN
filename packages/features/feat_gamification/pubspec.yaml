publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  core_theme:
    path: ../../core/core_theme
  core_router:
    path: ../../core/core_router
  core_network:
    path: ../../core/core_network
  core_utils:
    path: ../../core/core_utils
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.12.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  share_plus: ^11.1.0

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  test_support:
    path: ../test_support

flutter:
  assets:
    - assets/reward_store_catalog.json
