name: rayon_sports
description: Rayon Sports FC fan super-app
publish_to: none
version: 1.0.4+7

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core packages
  core_app:
    path: ../../packages/core/core_app
  core_theme:
    path: ../../packages/core/core_theme
  core_auth:
    path: ../../packages/core/core_auth
  core_feature_config:
    path: ../../packages/core/core_feature_config
  core_network:
    path: ../../packages/core/core_network
  core_router:
    path: ../../packages/core/core_router
  core_utils:
    path: ../../packages/core/core_utils

  # Club config
  club_rayon_sports:
    path: ../../packages/clubs/club_rayon_sports

  # Feature packages
  feat_home:
    path: ../../packages/features/feat_home
  feat_membership:
    path: ../../packages/features/feat_membership
  feat_gamification:
    path: ../../packages/features/feat_gamification
  feat_contributions:
    path: ../../packages/features/feat_contributions
  feat_shop:
    path: ../../packages/features/feat_shop
  feat_sms_ledger:
    path: ../../packages/features/feat_sms_ledger
  feat_settings:
    path: ../../packages/features/feat_settings
  feat_onboarding:
    path: ../../packages/features/feat_onboarding
  feat_ticketing:
    path: ../../packages/features/feat_ticketing
  feat_fan_clubs:
    path: ../../packages/features/feat_fan_clubs
  feat_live:
    path: ../../packages/features/feat_live
  feat_admin:
    path: ../../packages/features/feat_admin
  app_registry:
    path: ../../packages/app_registry

  # Third-party
  go_router: ^14.8.1
  supabase_flutter: ^2.12.2
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  firebase_core: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test_support:
    path: ../../packages/features/test_support

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/

resolution: workspace
