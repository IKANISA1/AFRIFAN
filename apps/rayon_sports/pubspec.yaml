name: rayon_sports
description: Rayon Sports FC fan super-app
publish_to: none
version: 1.0.4+7

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  core_app:
    path: ../../packages/core/core_app
  club_rayon_sports:
    path: ../../packages/clubs/club_rayon_sports
  app_registry:
    path: ../../packages/app_registry
  firebase_core: ^4.5.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test_support:
    path: ../../packages/testing/test_support
  core_theme:
    path: ../../packages/core/core_theme
  core_auth:
    path: ../../packages/core/core_auth
  core_feature_config:
    path: ../../packages/core/core_feature_config
  core_network:
    path: ../../packages/core/core_network
  core_router:
    path: ../../packages/core/core_router
  core_utils:
    path: ../../packages/core/core_utils
  feat_gamification:
    path: ../../packages/features/feat_gamification
  feat_home:
    path: ../../packages/features/feat_home
  feat_shop:
    path: ../../packages/features/feat_shop
  feat_settings:
    path: ../../packages/features/feat_settings
  feat_onboarding:
    path: ../../packages/features/feat_onboarding
  go_router: ^14.8.1
  supabase_flutter: ^2.12.2
  flutter_riverpod: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/

resolution: workspace
