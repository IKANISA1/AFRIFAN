name: dynamos
description: Dynamos FC — AFRICLUB fan super-app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  app_registry:
    path: ../../packages/app_registry
  core_app:
    path: ../../packages/core/core_app
  club_dynamos:
    path: ../../packages/clubs/club_dynamos

dev_dependencies:
  flutter_test:
    sdk: flutter
  test_support:
    path: ../../packages/testing/test_support
  flutter_lints: ^5.0.0
  core_router:
    path: ../../packages/core/core_router

flutter:
  uses-material-design: true

  assets:
    - assets/flavors/

resolution: workspace
