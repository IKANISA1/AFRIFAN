name = "africlub-fantasy-cron"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "FANTASY_KV"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
WORKER_ROLE = "multi-competition-sync"

# Secrets (set via wrangler secret put)
# RAPIDAPI_KEY
# SUPABASE_EDGE_URL
# SUPABASE_SERVICE_KEY
