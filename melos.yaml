name: africlub
repository: https://github.com/ikanisa/africlub

packages:
  - apps/**
  - packages/core/**
  - packages/features/**
  - packages/africlub_fantasy
  - packages/clubs/**

command:
  bootstrap:
    environment:
      sdk: ">=3.10.0 <4.0.0"
      flutter: ">=3.38.0"

scripts:
  analyze:
    run: melos exec -- flutter analyze --fatal-infos
    description: Analyze all packages

  format:
    run: melos exec -- dart format .
    description: Format all packages

  test_changed:
    run: melos exec --diff=origin/main...HEAD -- flutter test
    packageFilters:
      dirExists: test
    description: Run tests only on changed packages

  test_all:
    run: melos exec -- flutter test
    packageFilters:
      dirExists: test
    description: Run tests on all packages

  build_club:
    run: |
      flutter build appbundle \
        --dart-define-from-file=assets/flavors/production.json
    description: Build Play-ready Android App Bundle for a specific club (run from apps/{club}/)

  build_club_apk:
    run: |
      flutter build apk \
        --dart-define-from-file=assets/flavors/production.json
    description: Build Android APK for local validation (run from apps/{club}/)

  clean:
    run: melos exec -- flutter clean
    description: Clean all packages
