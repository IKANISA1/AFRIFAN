name: Set up the controlled Flutter runtime
description: Read the exact repository pin and pass it to the immutable setup action.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        set -euo pipefail
        flutter_version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.fvmrc")"
        [[ "$flutter_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$flutter_version" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ steps.pin.outputs.version }}
        channel: stable
        cache: true
