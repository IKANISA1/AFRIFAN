name: CI — Free Self-Hosted Release Gate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope to run on the zero-cost self-hosted runner
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - supabase
          - web
          - flutter
          - all

permissions:
  contents: read

concurrency:
  group: free-self-hosted-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact-commit runner preflight
    runs-on: [self-hosted, macOS, ARM64, africlub-free]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true

      - name: Bind evidence to the requested commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          echo "Validated ${GITHUB_SHA} on $(uname -m) $(sw_vers -productVersion)"

  supabase:
    name: Supabase contracts
    if: inputs.scope == 'supabase' || inputs.scope == 'all'
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, africlub-free]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Validate migration and Edge Function controls
        shell: bash
        run: |
          set -euo pipefail
          node tools/scripts/validate_repository_boundary.mjs
          node tools/scripts/validate_supabase_local_only_migrations.mjs
          node tools/scripts/validate_supabase_edge_contract.mjs
          deno check $(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print | sort)
          deno test --allow-env --allow-net --allow-read \
            $(find supabase/functions -type f \( -name '*_test.ts' -o -name '*test.ts' \) -print | sort)

      - name: Run the transactional database contract suite
        shell: bash
        run: corepack npm@12.0.2 exec --yes --package=supabase@2.113.0 -- supabase test db --local

      - name: Replay isolated database and concurrency contracts
        shell: bash
        run: |
          set -euo pipefail
          docker pull public.ecr.aws/supabase/postgres:17.6.1.158
          docker pull public.ecr.aws/supabase/gotrue:v2.195.0
          docker pull public.ecr.aws/supabase/storage-api:v1.68.10
          python3 tools/scripts/test_predict_database.py

  web:
    name: Web and Cloudflare candidate
    if: inputs.scope == 'web' || inputs.scope == 'all'
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, africlub-free]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/rayon_sports/web
    env:
      NEXT_PUBLIC_ANDROID_APP_LINK_SHA256_FINGERPRINTS: B8:B4:84:C9:3D:80:83:12:9C:90:1B:D4:9C:BE:35:65:7B:C1:4D:38:F3:D9:19:04:75:45:83:B5:AB:BC:E5:D9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: apps/rayon_sports/web/package-lock.json

      - name: Install exact dependencies
        run: corepack npm ci

      - name: Validate dependency graph and advisories
        run: corepack npm run check:dependencies

      - name: Run unit, static, and production-build gates
        run: |
          corepack npm run lint
          corepack npm test
          corepack npm run typecheck
          corepack npm run build
          corepack npm run size
          corepack npm run test:cloudflare-release

      - name: Run the controlled browser matrix
        run: corepack npm run test:e2e

      - name: Package and dry-run the Worker candidate
        run: |
          node scripts/build-opennext-isolated.mjs
          node scripts/fix-route-group-manifests.mjs --open-next
          corepack npm exec -- wrangler deploy --dry-run

  flutter:
    name: Flutter analysis and tests
    if: inputs.scope == 'flutter' || inputs.scope == 'all'
    needs: preflight
    runs-on: [self-hosted, macOS, ARM64, africlub-free]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'

      - uses: ./.github/actions/setup-flutter

      - name: Resolve and bootstrap the workspace
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Analyze every package
        run: dart run melos exec -- flutter analyze --fatal-infos --fatal-warnings

      - name: Test every package serially
        run: >-
          dart run melos exec --concurrency=1 --dir-exists="test" --
          bash "$MELOS_ROOT_PATH/tools/scripts/run_package_tests.sh"

      - name: Run release smoke and governance gates
        env:
          EVIDENCE_ROOT: ${{ github.workspace }}/docs/governance
          REPORT: ${{ runner.temp }}/africlub-evidence-privacy-validation.json
        run: |
          flutter test apps/rayon_sports/integration_test/release_readiness_smoke_test.dart
          node tools/scripts/validate_ios_qa_isolation.mjs
          node tools/scripts/validate_mobile_qa_isolation.mjs
          bash tools/scripts/validate_golden_contract.sh
          bash tools/scripts/validate_evidence_privacy.sh
