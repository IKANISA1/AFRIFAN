name: Deploy Gikundiro Web

on:
  push:
    branches: [main]
    paths:
      - "apps/rayon_sports/web/**"
      - ".github/workflows/deploy-gikundiro-web.yml"
  workflow_dispatch: # Allow manual deploys

concurrency:
  group: deploy-gikundiro-web
  cancel-in-progress: false # Never cancel a running deploy

env:
  WORKING_DIR: apps/rayon_sports/web

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: corepack npm ci

      - name: Validate dependency graph and advisories
        working-directory: ${{ env.WORKING_DIR }}
        run: corepack npm run check:dependencies

      - name: Build with OpenNext
        working-directory: ${{ env.WORKING_DIR }}
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: corepack npm exec -- opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        working-directory: ${{ env.WORKING_DIR }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: corepack npm exec -- wrangler deploy
