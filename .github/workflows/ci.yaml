name: CI — Analysis & Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Flutter: Analyze + Test
  # ──────────────────────────────────────────────
  flutter-ci:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate controlled Flutter runtime configuration
        run: bash tools/scripts/validate_flutter_runtime_pins.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Verify active Flutter runtime
        run: bash tools/scripts/validate_flutter_runtime_pins.sh --runtime

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generate route inventory and validate design source compliance
        env:
          SOURCE_DESIGN: ${{ github.workspace }}/DESIGN.md
          EXCEPTIONS_REGISTER: ${{ github.workspace }}/docs/governance/design-exceptions.json
          ROUTE_INVENTORY_JSON: ${{ runner.temp }}/africlub-route-inventory/route-inventory.json
          ROUTE_STATE_CLOSURE_JSON: ${{ runner.temp }}/africlub-route-inventory/route-state-closure.json
          SCREEN_ARCHETYPE_COVERAGE_JSON: ${{ runner.temp }}/africlub-route-inventory/screen-archetype-coverage.json
          COMPONENT_INVENTORY_JSON: ${{ runner.temp }}/africlub-component-inventory/universal-component-inventory.json
          OUT_DIR: ${{ runner.temp }}/africlub-route-inventory
        run: |
          bash tools/scripts/generate_route_inventory.sh
          OUT_DIR="${{ runner.temp }}/africlub-component-inventory" \
            bash tools/scripts/generate_component_inventory.sh
          dart run tools/scripts/generate_status_accessibility_inventory.dart \
            "${{ runner.temp }}/africlub-status-accessibility"
          jq -e '
            .summary.contract_complete == true and
            .summary.review_required == 0 and
            .summary.semantic_color_occurrences > 0 and
            .summary.status_component_occurrences > 0 and
            (.color_vision_simulations | length) == 8
          ' "${{ runner.temp }}/africlub-status-accessibility/status-inventory.json"
          OUT_DIR="${{ runner.temp }}/africlub-design-compliance" \
            bash tools/scripts/design_compliance_report.sh
          jq -e '
            .status == "pass" and
            .design_complete == false and
            .route_evidence_complete == false and
            .route_inventory_status == "pass" and
            .route_state_closure_status == "pass" and
            .screen_archetype_coverage_status == "pass" and
            .component_inventory_status == "pass" and
            .design_exceptions_schema_status == "pass"
          ' "${{ runner.temp }}/africlub-design-compliance/VALIDATION.json"

      - name: Upload design governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: design-governance-evidence
          path: |
            ${{ runner.temp }}/africlub-route-inventory
            ${{ runner.temp }}/africlub-component-inventory
            ${{ runner.temp }}/africlub-status-accessibility
            ${{ runner.temp }}/africlub-design-compliance
          retention-days: 30

      - name: Validate Rayon release contract
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVER_VALIDATION_MODE: ${{ github.event_name == 'pull_request' && 'auto' || 'strict' }}
        run: bash tools/scripts/validate_club_release.sh rayon_sports

      - name: Validate all club release contracts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVER_VALIDATION_MODE: ${{ github.event_name == 'pull_request' && 'auto' || 'strict' }}
        run: |
          for app in apps/*/; do
            slug="$(basename "$app")"
            if [ "$slug" = "output" ]; then
              continue
            fi
            bash tools/scripts/validate_club_release.sh "$slug"
          done

      - name: Analyze (fatal infos + warnings)
        run: melos exec -- flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests with coverage
        run: melos exec --dir-exists="test" -- flutter test --coverage

      - name: Validate governed golden baselines
        run: bash tools/scripts/validate_golden_contract.sh

      - name: Scan governed evidence for private or secret material
        run: bash tools/scripts/validate_evidence_privacy.sh

      - name: Upload golden baselines and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-evidence
          path: |
            packages/features/feat_settings/test/goldens
            packages/features/feat_settings/test/failures
            docs/governance/golden-baselines.json
          if-no-files-found: error
          retention-days: 30

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "❌ No white-label app shell smoke tests found."
            exit 1
          fi
          while IFS= read -r smoke_test; do
            app_dir="${smoke_test%/test/app_shell_smoke_test.dart}"
            flavor_file="$app_dir/assets/flavors/production.json"
            if [ ! -f "$flavor_file" ]; then
              echo "❌ Missing flavor contract: $flavor_file"
              exit 1
            fi
            echo "Testing $smoke_test with $flavor_file"
            flutter test "$smoke_test" --dart-define-from-file="$flavor_file"
          done <<< "$smoke_tests"

      - name: Run Rayon integration smoke tests
        run: flutter test apps/rayon_sports/integration_test

      - name: Validate no secrets in source
        run: |
          # Check for service_role patterns
          if grep -rn --include="*.dart" --include="*.json" --include="*.md" \
            'service_role' . --exclude-dir=build --exclude-dir=node_modules \
            --exclude-dir=.dart_tool | grep -v '.gitignore' | grep -v 'blueprint.md'; then
            echo "❌ Service role key reference found in source"
            exit 1
          fi

          TRACKED_SIGNING_FILES=$(git ls-files \
            'apps/*/android/*.jks' \
            'apps/*/android/*.keystore' \
            'apps/*/android/keystore.properties' \
            'apps/*/android/key.properties' \
            'apps/*/android/app/*.jks' \
            'apps/*/android/app/*.keystore')
          if [ -n "$TRACKED_SIGNING_FILES" ]; then
            echo "❌ Android signing material must not be committed:"
            echo "$TRACKED_SIGNING_FILES"
            exit 1
          fi

          TRACKED_RELEASE_SECRETS=$(git ls-files \
            'apps/*/android/fastlane/*service-account*.json' \
            'apps/*/android/fastlane/*.p8' \
            'apps/*/ios/**/*.p8' \
            'apps/*/ios/**/*.mobileprovision')
          if [ -n "$TRACKED_RELEASE_SECRETS" ]; then
            echo "❌ Mobile release credentials must not be committed:"
            echo "$TRACKED_RELEASE_SECRETS"
            exit 1
          fi

          # Check for committed dev vars (contain Cloudflare/Supabase secrets)
          TRACKED_DEV_VARS=$(git ls-files 'apps/**/web/.dev.vars' '*/.dev.vars' '.dev.vars' | grep -v '.example$' || true)
          if [ -n "$TRACKED_DEV_VARS" ]; then
            echo "❌ .dev.vars files must not be committed (contain secrets):"
            echo "$TRACKED_DEV_VARS"
            exit 1
          fi

          echo "✅ No service role keys found"

  # ──────────────────────────────────────────────
  # Web: TypeCheck + Build
  # ──────────────────────────────────────────────
  web-ci:
    name: Web TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/rayon_sports/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/rayon_sports/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Venue authorization and operations coverage
        run: npm run test:venue-coverage

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run size

      - name: Lighthouse CI
        run: npm run test:lighthouse

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rayon_sports/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/rayon_sports/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build
        env:
          AFRICLUB_ALLOW_HTTP_PREVIEW: "1"
        run: npm run build

      - name: Run E2E
        run: npm run test:e2e:ci

  # ──────────────────────────────────────────────
  # Android: Debug Build (PR gate — catch compile errors early)
  # ──────────────────────────────────────────────
  android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    needs: [flutter-ci]
    defaults:
      run:
        working-directory: apps/rayon_sports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          cd ../..
          melos bootstrap

      - name: Generate stub flavor overrides
        run: |
          jq '. + {"SUPABASE_URL": "https://stub.supabase.co", "SUPABASE_ANON_KEY": "stub-anon-key"}' \
            assets/flavors/production.json > assets/flavors/production.local.json

      - name: Build debug APK
        run: flutter build apk --debug --dart-define-from-file=assets/flavors/production.local.json

  # ──────────────────────────────────────────────
  # Android: Release Build (on main only)
  # ──────────────────────────────────────────────
  android-build:
    name: Android Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    needs: [flutter-ci]
    defaults:
      run:
        working-directory: apps/rayon_sports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          cd ../..
          melos bootstrap

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/keystore.properties

      - name: Generate production flavor overrides
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          jq \
            --arg supabase_url "$SUPABASE_URL" \
            --arg supabase_anon_key "$SUPABASE_ANON_KEY" \
            '.SUPABASE_URL = $supabase_url | .SUPABASE_ANON_KEY = $supabase_anon_key' \
            assets/flavors/production.json > assets/flavors/production.local.json

      - name: Build AAB
        run: flutter build appbundle --dart-define-from-file=assets/flavors/production.local.json

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: rayon-sports-release-aab
          path: apps/rayon_sports/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ──────────────────────────────────────────────
  # iOS: Release Build (on main only)
  # ──────────────────────────────────────────────
  ios-build:
    name: iOS Release Build
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    needs: [flutter-ci]
    defaults:
      run:
        working-directory: apps/rayon_sports
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          cd ../..
          melos bootstrap

      - name: Generate production flavor overrides
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          jq \
            --arg supabase_url "$SUPABASE_URL" \
            --arg supabase_anon_key "$SUPABASE_ANON_KEY" \
            '.SUPABASE_URL = $supabase_url | .SUPABASE_ANON_KEY = $supabase_anon_key' \
            assets/flavors/production.json > assets/flavors/production.local.json

      - name: Generate and validate iOS build configuration
        run: |
          flutter build ios --config-only --release --no-codesign --dart-define-from-file=assets/flavors/production.local.json
          dart run tool/validate_ios_dart_defines.dart ios/Flutter/Generated.xcconfig assets/flavors/production.local.json

      - name: Build iOS Framework
        run: flutter build ios --release --no-codesign --dart-define-from-file=assets/flavors/production.local.json
