name: Extract Keystore
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Save keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > /tmp/ks.b64
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: /tmp/ks.b64
