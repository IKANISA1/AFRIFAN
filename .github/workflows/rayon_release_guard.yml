name: Rayon Release Guard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rayon-release-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        run: dart pub get

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Rayon release contract
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: bash tools/scripts/validate_club_release.sh rayon_sports

      - name: Analyze workspace
        run: dart analyze

      - name: Check notification edge functions
        run: deno test supabase/functions/_shared/notifications_test.ts

      - name: Run shared quality tests
        run: >
          flutter test
          packages/core/core_theme/test
          packages/features/feat_home/test
          packages/features/feat_settings/test
          packages/features/feat_biopay/test

      - name: Run Rayon app tests
        run: >
          flutter test
          apps/rayon_sports/test

      - name: Build Rayon Play bundle
        working-directory: apps/rayon_sports
        run: flutter build appbundle --dart-define-from-file=assets/flavors/production.json
