name: Rayon Release Guard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rayon-release-guard:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_RELEASE_SECRETS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Install workspace dependencies
        run: melos bootstrap

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Rayon release contract
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVER_VALIDATION_MODE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && 'strict' || 'auto' }}
        run: bash tools/scripts/validate_club_release.sh rayon_sports

      - name: Analyze workspace
        run: dart analyze

      - name: Check notification edge functions
        run: deno test supabase/functions/_shared/notifications_test.ts

      - name: Run shared quality tests
        run: >
          flutter test
          packages/core/core_theme/test
          packages/features/feat_home/test
          packages/features/feat_settings/test
          packages/features/feat_BioPay/test

      - name: Run Rayon app tests
        run: >
          flutter test
          apps/rayon_sports/test

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "No white-label app shell smoke tests found."
            exit 1
          fi
          echo "$smoke_tests"
          # Paths are repo-controlled and space-free, so word splitting is intentional here.
          flutter test $smoke_tests

      - name: Run Rayon integration smoke tests
        run: >
          flutter test
          apps/rayon_sports/integration_test

      - name: Decode release signing keystore
        if: env.HAS_ANDROID_RELEASE_SECRETS == 'true'
        working-directory: apps/rayon_sports
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/keystore.properties
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Generate production flavor overrides
        if: env.HAS_ANDROID_RELEASE_SECRETS == 'true'
        working-directory: apps/rayon_sports
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          jq \
            --arg supabase_url "$SUPABASE_URL" \
            --arg supabase_anon_key "$SUPABASE_ANON_KEY" \
            '.SUPABASE_URL = $supabase_url | .SUPABASE_ANON_KEY = $supabase_anon_key' \
            assets/flavors/production.json > assets/flavors/production.local.json

      - name: Build Rayon Play bundle
        if: env.HAS_ANDROID_RELEASE_SECRETS == 'true'
        working-directory: apps/rayon_sports
        run: flutter build appbundle --dart-define-from-file=assets/flavors/production.local.json

      - name: Skip signed release bundle build
        if: env.HAS_ANDROID_RELEASE_SECRETS != 'true'
        run: echo "Skipping signed release bundle build because Android release secrets are unavailable."
