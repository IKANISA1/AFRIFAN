name: Rayon Release Guard

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rayon-release-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Install workspace dependencies
        run: melos bootstrap

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Rayon release contract
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVER_VALIDATION_MODE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && 'strict' || 'auto' }}
        run: bash tools/scripts/validate_club_release.sh rayon_sports

      - name: Analyze workspace
        run: dart analyze

      - name: Check notification edge functions
        run: deno test supabase/functions/_shared/notifications_test.ts

      - name: Run shared quality tests
        run: >
          flutter test
          packages/core/core_theme/test
          packages/features/feat_home/test
          packages/features/feat_settings/test
          packages/features/feat_biopay/test

      - name: Run Rayon app tests
        run: >
          flutter test
          apps/rayon_sports/test

      - name: Run Rayon integration smoke tests
        run: >
          flutter test
          apps/rayon_sports/integration_test

      - name: Decode release signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        working-directory: apps/rayon_sports
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/keystore.properties
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Rayon Play bundle
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        working-directory: apps/rayon_sports
        run: flutter build appbundle --dart-define-from-file=assets/flavors/production.json

      - name: Skip signed release bundle build
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' || secrets.ANDROID_KEYSTORE_PASSWORD == '' || secrets.ANDROID_KEY_ALIAS == '' || secrets.ANDROID_KEY_PASSWORD == '' }}
        run: echo "Skipping signed release bundle build because Android release secrets are unavailable."
