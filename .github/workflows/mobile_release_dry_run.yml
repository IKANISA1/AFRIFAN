name: Mobile Release Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-release-dry-run:
    name: Android Release Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVER_VALIDATION_MODE: strict

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Validate all club release contracts
        run: |
          for app in apps/*/; do
            slug="$(basename "$app")"
            if [ "$slug" = "output" ]; then
              continue
            fi
            bash tools/scripts/validate_club_release.sh "$slug"
          done

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "❌ No white-label app shell smoke tests found."
            exit 1
          fi
          echo "$smoke_tests"
          flutter test $smoke_tests

      - name: Build Android release dry run
        run: bash tools/scripts/dry_run_android_release.sh rayon_sports

      - name: Upload Android dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayon-sports-android-dry-run-aab
          path: apps/rayon_sports/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios-release-dry-run:
    name: iOS Release Dry Run
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVER_VALIDATION_MODE: strict

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Validate all club release contracts
        run: |
          for app in apps/*/; do
            slug="$(basename "$app")"
            if [ "$slug" = "output" ]; then
              continue
            fi
            bash tools/scripts/validate_club_release.sh "$slug"
          done

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "❌ No white-label app shell smoke tests found."
            exit 1
          fi
          echo "$smoke_tests"
          flutter test $smoke_tests

      - name: Build iOS release dry run
        run: bash tools/scripts/dry_run_ios_release.sh rayon_sports

      - name: Upload iOS dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: rayon-sports-ios-dry-run-app
          path: apps/rayon_sports/build/ios/iphoneos/Runner.app.zip
          retention-days: 14
