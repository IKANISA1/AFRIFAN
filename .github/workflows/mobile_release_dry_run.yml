name: Mobile Release Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android-release-dry-run:
    name: Android Release Dry Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVER_VALIDATION_MODE: strict

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare pinned Android bundle inspector
        run: python3 tools/scripts/prepare_bundletool.py "${{ runner.temp }}/africlub-tools/bundletool.jar"

      - uses: ./.github/actions/setup-flutter

      - name: Resolve workspace tooling
        run: flutter pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "❌ No white-label app shell smoke tests found."
            exit 1
          fi
          while IFS= read -r smoke_test; do
            app_dir="${smoke_test%/test/app_shell_smoke_test.dart}"
            flavor_file="$app_dir/assets/flavors/production.json"
            if [ ! -f "$flavor_file" ]; then
              echo "❌ Missing flavor contract: $flavor_file"
              exit 1
            fi
            flutter test "$smoke_test" --dart-define-from-file="$flavor_file"
          done <<< "$smoke_tests"

      - name: Build Android release dry run
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/africlub-tools/bundletool.jar
        run: bash tools/scripts/dry_run_android_release.sh rayon_sports

      - name: Upload Android dry-run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rayon-sports-android-dry-run-aab
          path: apps/rayon_sports/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios-release-dry-run:
    name: iOS Release Dry Run
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVER_VALIDATION_MODE: strict

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-flutter

      - name: Resolve workspace tooling
        run: flutter pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Run white-label app shell smoke tests
        run: |
          smoke_tests=$(find apps -path '*/test/app_shell_smoke_test.dart' ! -path 'apps/rayon_sports/*' | sort)
          if [ -z "$smoke_tests" ]; then
            echo "❌ No white-label app shell smoke tests found."
            exit 1
          fi
          while IFS= read -r smoke_test; do
            app_dir="${smoke_test%/test/app_shell_smoke_test.dart}"
            flavor_file="$app_dir/assets/flavors/production.json"
            if [ ! -f "$flavor_file" ]; then
              echo "❌ Missing flavor contract: $flavor_file"
              exit 1
            fi
            flutter test "$smoke_test" --dart-define-from-file="$flavor_file"
          done <<< "$smoke_tests"

      - name: Build iOS release dry run
        run: bash tools/scripts/dry_run_ios_release.sh rayon_sports

      - name: Upload iOS dry-run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rayon-sports-ios-dry-run-app
          path: apps/rayon_sports/build/ios/iphoneos/Runner.app.zip
          retention-days: 14
